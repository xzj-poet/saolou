name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: campus_sweep_test
          POSTGRES_PASSWORD: campus_sweep_test
          POSTGRES_USER: campus_sweep_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campus_sweep_test -d campus_sweep_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ADMIN_PASSWORD: ci-administrator-password
      ADMIN_USERNAME: admin
      DATABASE_ADMIN_URL: postgresql://campus_sweep_test:campus_sweep_test@127.0.0.1:5432/campus_sweep_test?schema=public
      DATABASE_URL: postgresql://campus_sweep_app:campus_sweep_app_test@127.0.0.1:5432/campus_sweep_test?schema=public
      POSTGRES_DB: campus_sweep_test
      POSTGRES_APP_PASSWORD: campus_sweep_app_test
      POSTGRES_APP_USER: campus_sweep_app
      POSTGRES_PASSWORD: campus_sweep_test
      POSTGRES_USER: campus_sweep_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate:deploy
      - run: npm run db:provision:app
      - run: npm run db:verify:app-role
      - run: npm run bootstrap:admin
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm run test:deployment
      - run: npm run test:backup:integration
      - run: npm run test:backup:windows
      - run: docker compose config --quiet
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: docker build --target app --tag campus-sweep-saas:${{ github.sha }} .
