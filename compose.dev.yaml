services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: campus_sweep
      POSTGRES_PASSWORD: campus_sweep_dev
      POSTGRES_USER: campus_sweep
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus_sweep -d campus_sweep"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - campus_sweep_pgdata:/var/lib/postgresql

volumes:
  campus_sweep_pgdata:
